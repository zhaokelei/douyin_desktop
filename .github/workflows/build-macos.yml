# 云端构建 macOS 版：Intel x64 + Apple Silicon arm64，各出 mpv / fvp 两个后端。
#
# 灰度迁移期（fvp = libmdk）四个产物并存：
#   DouyinDesktop-macOS-x64-mpv-<版本>.zip      ← Intel，libmpv（默认/稳定版）
#   DouyinDesktop-macOS-x64-fvp-<版本>.zip      ← Intel，libmdk（灰度版）
#   DouyinDesktop-macOS-arm64-mpv-<版本>.zip    ← Apple Silicon，libmpv
#   DouyinDesktop-macOS-arm64-fvp-<版本>.zip    ← Apple Silicon，libmdk
#
# 后端通过编译期 `--dart-define=PLAYER_BACKEND=...` 选择，同一份代码、
# 两套播放实现并存；mpv 版行为与灰度前完全一致。
#
# 用法一（手动）：Actions 页面选 build-macos → Run workflow
# 用法二（自动）：打 tag（如 v0.2.0）推送，产出 artifact 并附加到 Release
# 下载位置：Actions 对应运行的 Artifacts 区（保留 30 天）
name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: macOS ${{ matrix.arch }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    # 一个后端/架构失败不拖累其它三个，方便单独看灰度版编译错误。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            backend: mpv
            runner: macos-15-intel # Intel 宿主，产出 x86_64
          - arch: x64
            backend: fvp
            runner: macos-15-intel
          - arch: arm64
            backend: mpv
            runner: macos-15 # Apple Silicon 宿主
          - arch: arm64
            backend: fvp
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # 与 pubspec.lock 要求（>=3.47.0）一致
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析（只报告，不拦构建）
        run: flutter analyze lib
        continue-on-error: true

      - name: 读取版本号
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: 构建 macOS Release
        run: flutter build macos --release --dart-define=PLAYER_BACKEND=${{ matrix.backend }}

      - name: 校验产物架构与后端依赖
        run: |
          APP=build/macos/Build/Products/Release/douyin_desktop.app
          lipo -archs "$APP/Contents/MacOS/douyin_desktop"
          echo "--- Frameworks ---"
          ls "$APP/Contents/Frameworks" | head -30

      - name: 打包并改名（含架构 + 后端标识）
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/douyin_desktop.app \
            "DouyinDesktop-macOS-${{ matrix.arch }}-${{ matrix.backend }}-${{ steps.ver.outputs.version }}.zip"
          ls -lh DouyinDesktop-macOS-*.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDesktop-macOS-${{ matrix.arch }}-${{ matrix.backend }}-${{ steps.ver.outputs.version }}
          path: DouyinDesktop-macOS-${{ matrix.arch }}-${{ matrix.backend }}-*.zip
          retention-days: 30

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinDesktop-macOS-${{ matrix.arch }}-${{ matrix.backend }}-*.zip
