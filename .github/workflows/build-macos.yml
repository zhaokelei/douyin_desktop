# 云端构建 macOS 版（Intel x64 为主 + Apple Silicon arm64 附带）。
#
# 为什么用 macos-13：它是 GitHub 提供的 Intel（x86_64）宿主，只能产出 x86_64 原生包；
# macos-14 是 Apple Silicon 宿主，产出 arm64 原生包。两者不能互相替代。
#
# 用法一（手动）：Actions 页面选 build-macos → Run workflow
# 用法二（自动）：打 tag（如 v0.2.0）推送，产出 artifact 并附加到 Release
#
# 产物：
#   DouyinDesktop-macOS-x64-<版本>.zip    ← Intel Mac（主力）
#   DouyinDesktop-macOS-arm64-<版本>.zip  ← Apple Silicon（附带）
# 下载位置：Actions 对应运行的 Artifacts 区（保留 30 天）
name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------- Intel x64
  macos-x64:
    name: macOS Intel (x86_64)
    runs-on: macos-13 # Intel 宿主，产出 x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # 与 pubspec.lock 要求（>=3.47.0）一致
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析（只报告，不拦构建）
        run: flutter analyze lib
        continue-on-error: true

      - name: 构建 macOS Release（Intel）
        run: flutter build macos --release

      - name: 校验产物架构
        run: |
          APP=build/macos/Build/Products/Release/douyin_desktop.app
          lipo -archs "$APP/Contents/MacOS/douyin_desktop"
          ls -la "$APP/Contents/Frameworks" | head -20

      - name: 读取版本号
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: 打包并改名（含架构标识）
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/douyin_desktop.app \
            "DouyinDesktop-macOS-x64-${{ steps.ver.outputs.version }}.zip"
          ls -lh DouyinDesktop-macOS-*.zip

      - name: 上传 Intel 产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDesktop-macOS-x64-${{ steps.ver.outputs.version }}
          path: DouyinDesktop-macOS-x64-*.zip
          retention-days: 30

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinDesktop-macOS-x64-*.zip

  # --------------------------------------------------------- Apple Silicon
  macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14 # Apple Silicon 宿主
    # Intel 版失败也照样尝试 arm64，反之亦然（互不阻塞）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 macOS Release（arm64）
        run: flutter build macos --release

      - name: 校验产物架构
        run: |
          APP=build/macos/Build/Products/Release/douyin_desktop.app
          lipo -archs "$APP/Contents/MacOS/douyin_desktop"

      - name: 读取版本号
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: 打包并改名（含架构标识）
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/douyin_desktop.app \
            "DouyinDesktop-macOS-arm64-${{ steps.ver.outputs.version }}.zip"
          ls -lh DouyinDesktop-macOS-*.zip

      - name: 上传 arm64 产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDesktop-macOS-arm64-${{ steps.ver.outputs.version }}
          path: DouyinDesktop-macOS-arm64-*.zip
          retention-days: 30

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinDesktop-macOS-arm64-*.zip
